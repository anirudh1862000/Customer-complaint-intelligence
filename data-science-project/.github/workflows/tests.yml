name: Python tests

on:
  push:
    paths:
      - "data-science-project/**"
  pull_request:
    paths:
      - "data-science-project/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-science-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science-project/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest fastapi
      - run: pytest -q
